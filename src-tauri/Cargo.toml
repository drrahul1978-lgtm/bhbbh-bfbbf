[package]
name = "eve"
version = "1.0.0"
description = "EVE — a neural network built from scratch, running entirely on your device"
authors = ["EVE"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
# A desktop app that does its thinking in JavaScript does not need a large
# binary. Optimise for size and strip what is not needed.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows only: the webview refuses the camera and microphone until something
# answers its permission request, and nothing in the default shell does.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# Version matches what Tauri already resolves to (0.38.2). A different major
# pulls a second, incompatible copy of the same COM types and the build fails
# on a type mismatch that reads like nonsense.
