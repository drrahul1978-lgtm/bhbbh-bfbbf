<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kodexa — Learn JavaScript the fun way</title>
  <meta name="description" content="Kodexa is a free, Duolingo-style game for learning the basics of JavaScript: bite-size lessons, XP, streaks and hearts. No signup needed." />
  <meta name="theme-color" content="#131f24" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>

  <!-- ===== Home / lesson path ===== -->
  <main id="homeScreen">
    <header class="statbar">
      <span class="stat course-badge" title="JavaScript course">JS</span>
      <span class="stat streak" title="Day streak">🔥 <b id="statStreak">0</b></span>
      <span class="stat gems" title="Gems">💎 <b id="statGems">0</b></span>
      <span class="stat xp" title="Total XP">⚡ <b id="statXp">0</b></span>
    </header>

    <div id="path"></div>

    <nav class="bottomnav">
      <button id="navHome" class="nav-btn active" title="Home">🏠</button>
      <button id="navTrophy" class="nav-btn" title="Jump to current lesson">🏆</button>
      <button id="navSettings" class="nav-btn" title="Reset progress">⚙️</button>
    </nav>
  </main>

  <!-- ===== Lesson ===== -->
  <main id="lessonScreen" class="hidden">
    <div class="lesson-top">
      <button id="quitBtn" class="icon-btn" title="Quit lesson">✕</button>
      <div class="progress"><div id="progressFill"></div></div>
      <span class="lesson-hearts">❤️ <b id="lessonHearts">5</b></span>
    </div>
    <div id="exerciseArea"></div>
    <footer class="lesson-footer" id="lessonFooter">
      <div id="feedback" class="feedback hidden">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="feedback-detail" id="feedbackDetail"></div>
      </div>
      <button id="checkBtn" class="big-btn" disabled>CHECK</button>
    </footer>
  </main>

  <!-- ===== Lesson result ===== -->
  <main id="resultScreen" class="hidden">
    <div class="result-card" id="resultCard"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
