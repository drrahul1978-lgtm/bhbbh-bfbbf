<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeDeck — Code Any Language in the Browser</title>
  <meta name="description" content="A free online multi-language code editor & runner. Write and run Python, JavaScript, C++, C, C#, Java, Go, Rust and more — straight from the web, no setup." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128187;</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">&#128187;</span>
      <span class="logo-text">Code<span class="accent">Deck</span></span>
    </div>

    <div class="toolbar">
      <label class="lang-picker">
        <span class="lang-picker-label">Language</span>
        <select id="languageSelect" aria-label="Choose a language"></select>
      </label>

      <button id="runBtn" class="primary-btn" title="Run code (Ctrl+Enter)">
        <span class="run-icon">&#9654;</span> Run
      </button>
      <button id="resetBtn" class="ghost-btn" title="Reset to the starter snippet">&#8634; Reset</button>
      <button id="shareBtn" class="ghost-btn" title="Copy a shareable link to this code">&#128279; Share</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane editor-pane">
      <div class="pane-head">
        <span id="fileName" class="file-name">main</span>
        <span id="runtimeBadge" class="runtime-badge">loading runtimes…</span>
      </div>
      <div id="editor" class="editor"></div>
    </section>

    <div class="divider" id="divider" title="Drag to resize"></div>

    <section class="pane io-pane">
      <div class="io-block">
        <div class="pane-head">
          <span>Input (stdin)</span>
          <span class="hint">optional — what your program reads</span>
        </div>
        <textarea id="stdin" class="stdin" spellcheck="false" placeholder="Type any input your program should read here…"></textarea>
      </div>

      <div class="io-block io-output">
        <div class="pane-head">
          <span>Output</span>
          <button id="clearBtn" class="text-btn">clear</button>
        </div>
        <pre id="output" class="output"><span class="output-placeholder">Pick a language, write some code, and hit <strong>Run</strong> ▶</span></pre>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="statusBar" class="status-bar">Ready.</span>
    <span class="footer-credit">
      Runs in your browser &middot; compiled languages execute via the free
      <a href="https://github.com/engineer-man/piston" target="_blank" rel="noopener">Piston</a> API
    </span>
  </footer>

  <!-- Monaco editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
