name: Build the desktop app

# The Windows installer has to be built on Windows — the NSIS and MSI bundlers
# and the WebView2 tooling only exist there, so it cannot be cross-compiled from
# Linux. GitHub provides a Windows machine, which is what this uses.
#
# Push a tag like v1.0.0 and the installers appear on a draft release, ready to
# download. Or run it by hand from the Actions tab to get them as artifacts
# without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check her maths still holds
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Tauri needs a webview and its build headers on Linux. Windows has
      # WebView2 already, so this step is skipped there.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Type-check before the long build. A Windows-only compile error otherwise
      # surfaces twenty minutes in, after the whole dependency tree.
      - name: Check the Rust compiles
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Gather the files the app ships with
        run: node tools/build-dist.js

      - name: Draw the icon and derive every size
        run: node tools/make-icon.js

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Run the CLI straight from npx. The default is `npm run tauri build`,
          # which needs both a "tauri" script and an installed node_modules —
          # two things that can be missing or resolve to the wrong platform
          # binary. This build has no node dependencies, so it fetches the CLI
          # for whichever machine it is on and nothing else has to line up.
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: EVE ${{ github.ref_name }}
          releaseBody: |
            Runs entirely on your device — no account, no key, nothing uploaded.

            **Windows:** download the `.exe` installer below and run it. Windows
            SmartScreen will warn that the publisher is unknown, because this is
            not signed with a paid certificate: choose *More info → Run anyway*.
          releaseDraft: true
          prerelease: false

      # Also keep them as artifacts, so a manual run gives you something to
      # download without publishing a release.
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: eve-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
